<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios - Tech Lab System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 mb-4">
        <a class="navbar-brand" href="dashboard.html"><i class="bi bi-tools me-2"></i>Tech Lab</a>
        <div class="navbar-nav">
            <a class="nav-link" href="dashboard.html"><i class="bi bi-box-seam me-1"></i> Inventario</a>
            <a class="nav-link" href="categories.html"><i class="bi bi-tags me-1"></i> Categorías</a>
            <a class="nav-link active" href="users.html"><i class="bi bi-people me-1"></i> Usuarios</a>
            <a class="nav-link" href="loans.html"><i class="bi bi-arrow-left-right me-1"></i> Préstamos</a>
        </div>
        <span id="userInfo" class="text-white ms-auto"></span>
    </nav>

    <div class="container">
        <div id="messageBox" class="alert d-none" role="alert"></div>

        <div class="row">
            <!-- Formulario para crear usuario -->
            <div class="col-md-4">
                <div class="card shadow border-0 p-4">
                    <h4 class="mb-3 text-secondary">Registrar Usuario</h4>
                    <form id="userForm">
                        <div class="mb-3">
                            <label class="form-label">Nombre Completo</label>
                            <input type="text" id="full_name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña (Hash)</label>
                            <input type="text" id="password_hash" class="form-control" required placeholder="Pega el hash aquí">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rol</label>
                            <select id="role_id" class="form-select">
                                <option value="2">Estudiante</option>
                                <option value="1">Administrador</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">Crear Usuario</button>
                    </form>
                </div>
            </div>

            <!-- Tabla de usuarios -->
            <div class="col-md-8">
                <div class="card shadow border-0 p-4">
                    <h4 class="mb-3 text-secondary">Lista de Usuarios</h4>
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Usamos sessionStorage para evitar compartir sesión entre pestañas
        const user = JSON.parse(sessionStorage.getItem('user'));
        
        // ROUTE GUARD: Si no hay usuario, al login. Si no es admin, al dashboard.
        if (!user) { 
            window.location.href = 'login.html'; 
        } else if (user.role.toLowerCase() !== 'admin') {
            window.location.href = 'dashboard.html';
        } else { 
            document.getElementById('userInfo').innerHTML = `<i class="bi bi-person-circle me-1"></i>${user.full_name} (${user.role})`; 
        }

        function showMessage(text, isError) {
            const box = document.getElementById('messageBox');
            box.innerText = text;
            box.className = `alert ${isError ? 'alert-danger' : 'alert-success'}`;
            setTimeout(() => box.className = 'alert d-none', 3000);
        }

        async function loadUsers() {
            const res = await fetch('http://localhost:8000/api/users');
            if (!res.ok) return; 
            const users = await res.json();
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';
            users.forEach(u => {
                tbody.innerHTML += `
                    <tr>
                        <td>${u.id}</td>
                        <td>${u.name}</td>
                        <td>${u.email}</td>
                        <td>${u.role_id === 1 ? 'Admin' : 'Estudiante'}</td>
                        <td>
                            <button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id})">Eliminar</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function deleteUser(id) {
            if (!confirm('¿Estás seguro de eliminar a este usuario?')) return;
            const res = await fetch(`http://localhost:8000/api/users/${id}`, {
                method: 'DELETE',
                headers: { 'X-User-Role': user.role }
            });
            if (res.ok) {
                showMessage('Usuario eliminado correctamente.', false);
                loadUsers();
            } else {
                showMessage('Error al eliminar usuario.', true);
            }
        }

        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('http://localhost:8000/api/users', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-User-Role': user.role 
                },
                body: JSON.stringify({
                    full_name: document.getElementById('full_name').value,
                    email: document.getElementById('email').value,
                    password_hash: document.getElementById('password_hash').value,
                    role_id: parseInt(document.getElementById('role_id').value)
                })
            });
            if (res.ok) {
                showMessage('Usuario creado exitosamente.', false);
                document.getElementById('userForm').reset();
                loadUsers();
            } else {
                showMessage('Error al crear usuario (puede que el email ya exista).', true);
            }
        });

        loadUsers();
    </script>
</body>
</html>
