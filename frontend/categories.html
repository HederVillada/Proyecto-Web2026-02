<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Categorías - Tech Lab System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html"><i class="bi bi-tools me-2"></i>Tech Lab</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav">
                    <a class="nav-link" href="dashboard.html"><i class="bi bi-box-seam me-1"></i> Inventario</a>
                    <a class="nav-link active" href="categories.html"><i class="bi bi-tags me-1"></i> Categorías</a>
                    <a class="nav-link" href="users.html"><i class="bi bi-people me-1"></i> Usuarios</a>
                    <a class="nav-link" href="loans.html"><i class="bi bi-arrow-left-right me-1"></i> Préstamos</a>
                </div>
                <span id="userInfo" class="text-white ms-auto mt-2 mt-lg-0"></span>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow border-0 p-4">
            <h4 class="mb-3 text-secondary">Lista de Categorías</h4>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                        </tr>
                    </thead>
                    <tbody id="categoriesTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const user = JSON.parse(sessionStorage.getItem('user'));
        if (!user) { 
            window.location.href = 'login.html'; 
        } else if (user.role.toLowerCase() !== 'admin') {
            window.location.href = 'dashboard.html';
        } else { 
            document.getElementById('userInfo').innerHTML = `<i class="bi bi-person-circle me-1"></i>${user.full_name} (${user.role})`; 
        }

        async function loadCategories() {
            const res = await fetch('http://192.168.20.24:8000/api/categories');
            const cats = await res.json();
            const tbody = document.getElementById('categoriesTableBody');
            tbody.innerHTML = '';
            cats.forEach(c => {
                tbody.innerHTML += `
                    <tr>
                        <td>${c.id}</td>
                        <td>${c.name}</td>
                    </tr>
                `;
            });
        }
        loadCategories();
    </script>
</body>
</html>
