<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Préstamos - Tech Lab System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 mb-4">
        <a class="navbar-brand" href="dashboard.html"><i class="bi bi-tools me-2"></i>Tech Lab</a>
        <div class="navbar-nav">
            <a class="nav-link" href="dashboard.html"><i class="bi bi-box-seam me-1"></i> Inventario</a>
            <a class="nav-link" href="categories.html"><i class="bi bi-tags me-1"></i> Categorías</a>
            <a class="nav-link" href="users.html"><i class="bi bi-people me-1"></i> Usuarios</a>
            <a class="nav-link active" href="loans.html"><i class="bi bi-arrow-left-right me-1"></i> Préstamos</a>
        </div>
        <span id="userInfo" class="text-white ms-auto"></span>
    </nav>

    <div class="container">
        <div id="messageBox" class="alert d-none" role="alert"></div>

        <div class="row">
            <!-- Formulario para crear préstamo -->
            <div class="col-md-4">
                <div class="card shadow border-0 p-4">
                    <h4 class="mb-3 text-secondary">Registrar Préstamo</h4>
                    <form id="loanForm">
                        <div class="mb-3">
                            <label class="form-label">Usuario (Estudiante)</label>
                            <!-- Dropdown dinámico -->
                            <select id="user_id" class="form-select" required>
                                <option value="">Cargando usuarios...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">ID del Equipo</label>
                            <input type="number" id="equipment_id" class="form-control" required placeholder="Ej: 2">
                        </div>
                        <button type="submit" class="btn btn-dark w-100">Prestar Equipo</button>
                    </form>
                </div>
            </div>

            <!-- Tabla del reporte -->
            <div class="col-md-8">
                <div class="card shadow border-0 p-4">
                    <h4 class="mb-3 text-secondary">Reporte: ¿Quién tiene qué?</h4>
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Usuario</th>
                                <th>Equipo</th>
                                <th>Serial</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="reportTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Usamos sessionStorage para evitar compartir sesión entre pestañas
        const user = JSON.parse(sessionStorage.getItem('user'));
        
        // ROUTE GUARD: Si no hay usuario, al login. (Ambos roles pueden ver loans.html).
        if (!user) { 
            window.location.href = 'login.html'; 
        } else { 
            document.getElementById('userInfo').innerHTML = `<i class="bi bi-person-circle me-1"></i>${user.full_name} (${user.role})`; 
        }

        function showMessage(text, isError) {
            const box = document.getElementById('messageBox');
            box.innerText = text;
            box.className = `alert ${isError ? 'alert-danger' : 'alert-success'}`;
            setTimeout(() => box.className = 'alert d-none', 3000);
        }

        // 1. Cargar los usuarios en el dropdown
        async function loadUsersDropdown() {
            const res = await fetch('http://localhost:8000/api/users');
            const users = await res.json();
            const select = document.getElementById('user_id');
            select.innerHTML = '<option value="">Selecciona un usuario...</option>';
            
            users.forEach(u => {
                // Solo mostramos a los estudiantes (role_id === 2) para préstamos
                if (u.role_id === 2) {
                    select.innerHTML += `<option value="${u.id}">${u.name} (${u.email})</option>`;
                }
            });
        }

        // 2. Cargar el reporte de préstamos
        async function loadReport() {
            const res = await fetch('http://localhost:8000/api/reservations/report');
            const report = await res.json();
            const tbody = document.getElementById('reportTableBody');
            tbody.innerHTML = '';
            report.forEach(r => {
                tbody.innerHTML += `
                    <tr>
                        <td>${r.user}</td>
                        <td>${r.equipment}</td>
                        <td>${r.serial}</td>
                        <td><span class="badge bg-primary">${r.status}</span></td>
                    </tr>
                `;
            });
        }

        // 3. Escuchar el submit del formulario
        document.getElementById('loanForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('http://localhost:8000/api/reservations', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-User-Role': user.role // IMPORTANTE: Enviamos el rol para que el backend no de 403
                },
                body: JSON.stringify({
                    user_id: parseInt(document.getElementById('user_id').value),
                    equipment_id: parseInt(document.getElementById('equipment_id').value)
                })
            });
            if (res.ok) {
                showMessage('Préstamo registrado. El equipo ahora está LOANED.', false);
                document.getElementById('loanForm').reset();
                loadReport(); // Actualizamos la tabla
            } else {
                const errData = await res.json();
                showMessage('Error del servidor: ' + errData.detail, true);
            }
        });

        // Al abrir la página, cargamos el dropdown y el reporte
        loadUsersDropdown();
        loadReport();
    </script>
</body>
</html>
